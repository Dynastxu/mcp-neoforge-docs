[project]
name = "mcp-neoforge-docs"
version = "0.1.0"
description = "Local MCP server over the bundled NeoForge documentation"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]

[project.scripts]
neoforge-docs-index = "neoforge_docs_mcp.index:main"
neoforge-docs-mcp = "neoforge_docs_mcp.server:main"
neoforge-docs-search = "neoforge_docs_mcp.search:main"
neoforge-docs-config = "neoforge_docs_mcp.setup_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neoforge_docs_mcp"]
